# Local infrastructure for development. The API, worker and web app run on the host
# (see Makefile). Start with:  docker compose up -d   (add --profile ollama for a local LLM)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bnip
      POSTGRES_PASSWORD: bnip
      POSTGRES_DB: bnip
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnip -d bnip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
