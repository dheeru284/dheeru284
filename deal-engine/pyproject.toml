[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP017", "E501", "UP042", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B011", "E402", "F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", "app/database/migrations/"]
plugins = []
