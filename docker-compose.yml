services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: bizdev, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME}", POSTGRES_DB: bizdev}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bizdev"], interval: 5s, retries: 10}
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "bizdev.cli", "worker", "--interval", "60"]
    depends_on: [web]
volumes: {pgdata: {}}
