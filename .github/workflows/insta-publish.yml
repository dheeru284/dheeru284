name: Insta Autopilot - publish due posts

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: insta-autopilot-write, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: insta-autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          MEDIA_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m autopilot.main publish
      - run: |
          git config user.name "insta-autopilot"
          git config user.email "insta-autopilot@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || { git commit -q -m "Mark published posts"; git pull -q --rebase; git push -q; }
