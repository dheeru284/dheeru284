# Netlify: static site in site/, serverless data proxies in netlify/functions (free tier).
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/results.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Explicit routes to the functions (they also declare config.path; this is a fallback).
[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/chain"
  to = "/.netlify/functions/chain"
  status = 200
